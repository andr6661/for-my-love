<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Для тебя ❤️</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Inter:wght@300;400;600&display=swap');

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #05020a;
            font-family: 'Inter', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        .font-handwriting {
            font-family: 'Caveat', cursive;
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .glass-card {
            background: rgba(18, 10, 26, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 182, 193, 0.2);
            box-shadow: 0 8px 32px 0 rgba(255, 20, 147, 0.25),
                        inset 0 0 15px rgba(255, 105, 180, 0.15);
        }

        .fade-enter {
            opacity: 0;
            transform: scale(0.9) translateY(20px);
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .fade-enter-active {
            opacity: 1;
            transform: scale(1) translateY(0);
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="relative w-screen h-screen flex items-center justify-center text-white overflow-hidden">

    <!-- Interactive Canvas Layer -->
    <div id="canvas-container">
        <canvas id="heartCanvas"></canvas>
    </div>

    <!-- Center Interactive Hint -->
    <div id="hintText" class="absolute bottom-12 z-10 pointer-events-none text-center px-4 transition-opacity duration-700">
        <p class="text-pink-200/80 text-sm tracking-widest uppercase font-light animate-pulse mb-1">
            Коснись сердца
        </p>
        <div class="flex justify-center items-center gap-1 text-xs text-pink-400/50">
            <i data-lucide="sparkles" class="w-3.5 h-3.5"></i>
            <span>нажми в любое место</span>
            <i data-lucide="sparkles" class="w-3.5 h-3.5"></i>
        </div>
    </div>

    <!-- Romantic Letter Modal Popup -->
    <div id="letterModal" class="fixed inset-0 z-30 flex items-center justify-center p-4 bg-black/60 backdrop-blur-md opacity-0 pointer-events-none transition-opacity duration-500">
        <div id="modalContent" class="glass-card max-w-md w-full rounded-3xl p-6 sm:p-8 relative border border-pink-500/30 shadow-2xl fade-enter max-h-[85vh] flex flex-col justify-between">
            
            <!-- Close Button -->
            <button id="closeBtn" class="absolute top-4 right-4 p-2 text-pink-300/70 hover:text-pink-100 hover:bg-white/10 rounded-full transition-all">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>

            <!-- Card Header -->
            <div class="flex items-center gap-3 mb-4 border-b border-pink-500/20 pb-3">
                <div class="p-2.5 rounded-2xl bg-gradient-to-tr from-pink-600 to-rose-400 text-white shadow-md">
                    <i data-lucide="heart" class="w-5 h-5 fill-current"></i>
                </div>
                <div>
                    <h2 class="text-lg font-semibold text-pink-100 leading-tight">Для тебя ❤️</h2>
                    <p class="text-xs text-pink-300/60">Маленькое напоминание</p>
                </div>
            </div>

            <!-- Card Body / Typing Text Area -->
            <div class="overflow-y-auto no-scrollbar my-2 pr-1 flex-grow">
                <p id="typedText" class="font-handwriting text-2xl sm:text-3xl text-pink-100 leading-relaxed font-semibold min-h-[160px] whitespace-pre-wrap"></p>
            </div>

            <!-- Card Footer -->
            <div class="mt-4 pt-3 border-t border-pink-500/20 flex items-center justify-between">
                <span class="text-xs text-pink-300/50 flex items-center gap-1">
                    <i data-lucide="sparkles" class="w-3.5 h-3.5"></i> С любовью
                </span>
                <button id="explodeBtn" class="px-4 py-2 bg-gradient-to-r from-pink-500 to-rose-500 hover:from-pink-600 hover:to-rose-600 text-white text-xs font-medium rounded-xl shadow-lg shadow-pink-500/25 active:scale-95 transition-all flex items-center gap-1.5 opacity-0 pointer-events-none duration-500">
                    <i data-lucide="heart-handshake" class="w-4 h-4"></i>
                    <span>Нажми меня ❤️</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Final Black Screen with Glowing Text -->
    <div id="finalScreen" class="fixed inset-0 z-50 bg-black flex items-center justify-center opacity-0 pointer-events-none transition-opacity duration-1000">
        <h1 id="finalText" class="font-handwriting text-5xl sm:text-7xl text-pink-500 font-bold tracking-wide text-center px-4 transition-all duration-1000 scale-95 opacity-0 drop-shadow-[0_0_25px_rgba(255,105,180,0.8)]">
            Я тебя люблю
        </h1>
    </div>

    <script>
        lucide.createIcons();

        // CANVAS PARTICLES SETUP
        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initHeartParticles();
        });

        const particles = [];
        const backgroundParticles = [];
        const numHeartParticles = Math.min(window.innerWidth < 600 ? 1200 : 2200, 2500);
        let pointer = { x: width / 2, y: height / 2 };
        let isExploded = false;

        function getHeartPosition(t) {
            const scale = Math.min(width, height) / 38;
            const x = 16 * Math.pow(Math.sin(t), 3);
            const y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
            return { x: x * scale, y: y * scale };
        }

        class HeartParticle {
            constructor() {
                this.reset();
            }

            reset() {
                this.t = Math.random() * Math.PI * 2;
                const pos = getHeartPosition(this.t);
                
                const spread = (Math.random() - 0.5) * 25;
                this.targetX = pos.x + spread;
                this.targetY = pos.y + spread;

                this.x = (Math.random() - 0.5) * width;
                this.y = (Math.random() - 0.5) * height;

                this.vx = 0;
                this.vy = 0;
                this.speed = 0.04 + Math.random() * 0.04;
                this.friction = 0.88 + Math.random() * 0.05;

                this.size = Math.random() * 2 + 0.8;
                const colors = [
                    'rgba(255, 60, 120, ',
                    'rgba(255, 120, 180, ',
                    'rgba(255, 180, 210, ',
                    'rgba(220, 40, 90, '
                ];
                this.colorPrefix = colors[Math.floor(Math.random() * colors.length)];
                this.alpha = Math.random() * 0.7 + 0.3;
            }

            explode() {
                const angle = Math.random() * Math.PI * 2;
                const force = Math.random() * 25 + 10;
                this.vx = Math.cos(angle) * force;
                this.vy = Math.sin(angle) * force;
                this.friction = 0.96;
            }

            update(time) {
                if (isExploded) {
                    this.x += this.vx;
                    this.y += this.vy;
                    this.vx *= this.friction;
                    this.vy *= this.friction;
                    this.alpha -= 0.008;
                    return;
                }

                const pulse = 1 + Math.sin(time * 3) * 0.06;
                const tx = this.targetX * pulse + width / 2;
                const ty = this.targetY * pulse + height / 2 - 20;

                let dx = pointer.x - this.x;
                let dy = pointer.y - this.y;
                let dist = Math.sqrt(dx * dx + dy * dy);
                
                if (dist < 100) {
                    const force = (100 - dist) / 100;
                    this.vx -= (dx / dist) * force * 4;
                    this.vy -= (dy / dist) * force * 4;
                }

                this.vx += (tx - this.x) * this.speed;
                this.vy += (ty - this.y) * this.speed;

                this.vx *= this.friction;
                this.vy *= this.friction;

                this.x += this.vx;
                this.y += this.vy;
            }

            draw() {
                if (this.alpha <= 0) return;
                ctx.fillStyle = this.colorPrefix + Math.max(0, this.alpha) + ')';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        class BackgroundStar {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.size = Math.random() * 1.5;
                this.alpha = Math.random() * 0.5 + 0.1;
                this.speed = Math.random() * 0.02 + 0.005;
            }

            update() {
                this.alpha += Math.sin(Date.now() * this.speed) * 0.01;
            }

            draw() {
                ctx.fillStyle = `rgba(255, 220, 240, ${Math.max(0.05, Math.min(0.8, this.alpha))})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function initHeartParticles() {
            particles.length = 0;
            backgroundParticles.length = 0;

            for (let i = 0; i < numHeartParticles; i++) {
                particles.push(new HeartParticle());
            }

            for (let i = 0; i < 150; i++) {
                backgroundParticles.push(new BackgroundStar());
            }
        }

        initHeartParticles();

        function updatePointer(e) {
            const x = e.touches ? e.touches[0].clientX : e.clientX;
            const y = e.touches ? e.touches[0].clientY : e.clientY;
            pointer.x = x;
            pointer.y = y;
        }

        window.addEventListener('mousemove', updatePointer);
        window.addEventListener('touchmove', updatePointer, { passive: true });

        function animate(time) {
            ctx.fillStyle = 'rgba(5, 2, 10, 0.25)';
            ctx.fillRect(0, 0, width, height);

            if (!isExploded) {
                backgroundParticles.forEach(star => {
                    star.update();
                    star.draw();
                });
            }

            particles.forEach(p => {
                p.update(time * 0.001);
                p.draw();
            });

            requestAnimationFrame(animate);
        }

        requestAnimationFrame(animate);

        // MODAL & EXPLOSION LOGIC
        const letterModal = document.getElementById('letterModal');
        const modalContent = document.getElementById('modalContent');
        const typedTextEl = document.getElementById('typedText');
        const hintText = document.getElementById('hintText');
        const closeBtn = document.getElementById('closeBtn');
        const explodeBtn = document.getElementById('explodeBtn');
        const finalScreen = document.getElementById('finalScreen');
        const finalText = document.getElementById('finalText');

        const romanticMessage = "Каждый день я благодарю судьбу за то, что ты есть в моей жизни.\n\nТвоя улыбка освещает всё вокруг, а твои глаза — это самое прекрасное, что я видел...\n\nДаже когда мы не вместе, я могу тебя так порадовать! Улыбайся чаще, твоя улыбка самая яркая, а глаза самые красивые! ❤️";

        let typingTimeout;

        function typeWriter(text, i = 0) {
            if (i < text.length) {
                typedTextEl.textContent += text.charAt(i);
                typingTimeout = setTimeout(() => typeWriter(text, i + 1), 35 + Math.random() * 25);
            } else {
                // Show the final button when text finishes typing
                explodeBtn.classList.remove('opacity-0', 'pointer-events-none');
            }
        }

        function openModal() {
            if (isExploded) return;
            hintText.classList.add('opacity-0');
            letterModal.classList.remove('opacity-0', 'pointer-events-none');
            modalContent.classList.add('fade-enter-active');

            confetti({
                particleCount: 40,
                spread: 60,
                origin: { y: 0.6 },
                colors: ['#ff2b5b', '#ff69b4', '#ffb6c1']
            });

            typedTextEl.textContent = '';
            clearTimeout(typingTimeout);
            explodeBtn.classList.add('opacity-0', 'pointer-events-none');
            setTimeout(() => typeWriter(romanticMessage), 300);
        }

        function closeModal() {
            letterModal.classList.add('opacity-0', 'pointer-events-none');
            modalContent.classList.remove('fade-enter-active');
            clearTimeout(typingTimeout);
        }

        canvas.addEventListener('click', (e) => {
            if (isExploded) return;
            confetti({
                particleCount: 15,
                scalar: 0.8,
                spread: 50,
                origin: { x: e.clientX / window.innerWidth, y: e.clientY / window.innerHeight },
                colors: ['#ff2b5b', '#ffa8c5']
            });
            openModal();
        });

        closeBtn.addEventListener('click', closeModal);

        // Explode Heart and Show Black Screen Animation
        explodeBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            closeModal();

            // Explode particles
            isExploded = true;
            particles.forEach(p => p.explode());

            // Big Confetti explosion
            confetti({
                particleCount: 120,
                spread: 100,
                origin: { y: 0.5 },
                colors: ['#ff0055', '#ff66aa', '#ffffff', '#ffd700']
            });

            // Fade to black screen after 1.2 seconds
            setTimeout(() => {
                finalScreen.classList.remove('opacity-0', 'pointer-events-none');
                
                // Smoothly show "Я тебя люблю" text
                setTimeout(() => {
                    finalText.classList.remove('opacity-0', 'scale-95');
                    finalText.classList.add('opacity-100', 'scale-100');
                }, 800);
            }, 1200);
        });
    </script>
</body>
</html>
